<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Dashboard | Xpress</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/portal.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,Arial,sans-serif;background:#f6f4f4;color:#111;font-size:14px}
header.bar{background:#111;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.bar b{font-size:16px}nav.tabs{display:flex;gap:4px}nav.tabs button{background:none;border:0;color:#ccc;padding:9px 16px;border-radius:30px;font:700 13px inherit;font-family:inherit;cursor:pointer;position:relative}nav.tabs button[aria-selected=true]{background:#ef4b00;color:#fff}
.badge{background:#fff;color:#ef4b00;border-radius:20px;font-size:11px;padding:1px 7px;margin-left:5px}
.wrap{max-width:1250px;margin:0 auto;padding:22px}.card{background:#fff;border:1px solid #e8e5e3;border-radius:16px;padding:18px}
.cols{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}@media(max-width:850px){.cols{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;max-height:70vh;overflow:auto}.item{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}.item:hover,.item.sel{background:#fff4ee}.item .n{font-weight:800;display:flex;justify-content:space-between;gap:8px}.item small{color:#777;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{background:#ef4b00;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:30px;background:#eee}.s-new{background:#fff1ea;color:#b53b00}.s-reviewing{background:#fff7d6;color:#8a6d00}.s-quoted{background:#e8f0ff;color:#1c4fb5}.s-scheduled,.s-completed{background:#e5f6ea;color:#1a7f37}.s-cancelled{background:#eee;color:#666}.urg{color:#b3261e;font-weight:800}
.thread{display:flex;flex-direction:column;gap:8px;height:52vh;overflow:auto;padding:6px;background:#f6f4f4;border-radius:12px}
.m{max-width:75%;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid #e8e5e3}.m.staff{align-self:flex-end;background:#111;color:#fff;border-color:#111}.m.system{align-self:center;background:none;border:0;color:#777;font-size:12px}.m p{margin:0;overflow-wrap:anywhere}.m time{display:block;font-size:10px;opacity:.6;margin-top:3px}
.reply{display:flex;gap:8px;margin-top:10px}.reply input{flex:1}input,select,textarea{font:inherit;padding:9px 11px;border:1px solid #d9d4d1;border-radius:10px;background:#fff}
button.b{background:#ef4b00;color:#fff;border:0;border-radius:30px;padding:10px 18px;font:800 13px inherit;font-family:inherit;cursor:pointer}button.b.g{background:#fff;color:#111;border:1px solid #cfc9c6}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}th{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:.05em}tr.click{cursor:pointer}tr.click:hover{background:#fff4ee}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid #e8e5e3;border-radius:14px;padding:14px}.stat b{display:block;font-size:26px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700}
.login{max-width:380px;margin:10vh auto}.lf{display:flex;flex-direction:column;gap:10px;margin-top:10px}.lf input{width:100%}.err{color:#b3261e}.muted{color:#777}h2{margin:0 0 10px}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.thumbs a{width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid #e8e5e3;display:block}.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<div id="root"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),root=$('#root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME=null,DIR=[],tab='chats',sel=null,after=0,poll=null,summary={};
const api=async(u,o={})=>{const r=await fetch(u,{headers:{'content-type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&!u.startsWith('/api/staff/login')&&!u.startsWith('/api/staff/setup')){ME=null;login();throw new Error('auth')}if(r.status===403&&j.code==='must_change'){forceChange();throw new Error('auth')}if(!r.ok)throw new Error(j.error||'Error');return j};
const ago=d=>{const s=(Date.now()-new Date(d))/1000;return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
const t=d=>new Date(d).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});

async function login(){
 clearInterval(poll);const st=await fetch('/api/staff/status').then(r=>r.json()).catch(()=>({}));
 if(st.needsSetup){root.innerHTML=`<div class="card login"><h2>Set up your owner account</h2><p class="muted">First time here. Enter the setup key from your server settings (ADMIN_PASSWORD), then create your own login.</p><form class="lf"><input name="key" type="password" placeholder="Setup key" required><input name="name" placeholder="Your name" autocomplete="name" required><input name="email" type="email" placeholder="Your email" autocomplete="username" required><input name="password" type="password" placeholder="Password (10+ characters)" autocomplete="new-password" minlength="10" required><p class="err"></p><button class="b" style="width:100%">Create owner account</button></form></div>`;
  $('form',root).onsubmit=async e=>{e.preventDefault();try{await api('/api/staff/setup',{method:'POST',body:Object.fromEntries(new FormData(e.target))});shell()}catch(x){$('.err',root).textContent=x.message}};return}
 root.innerHTML=`<div class="card login"><h2>Xpress staff sign in</h2><form class="lf"><input name="email" type="email" placeholder="Email" autocomplete="username" required autofocus><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><p class="err"></p><button class="b" style="width:100%">Sign in</button></form></div>`;
 $('form',root).onsubmit=async e=>{e.preventDefault();try{await api('/api/staff/login',{method:'POST',body:Object.fromEntries(new FormData(e.target))});shell()}catch(x){$('.err',root).textContent=x.message}}}
function forceChange(forced=true){clearInterval(poll);root.innerHTML=`<div class="card login"><h2>${forced?'Choose a new password':'Change password'}</h2>${forced?'<p class="muted">For security, set your own password before you continue.</p>':''}<form class="lf"><input name="current" type="password" placeholder="${forced?'Temporary / current password':'Current password'}" autocomplete="current-password" required><input name="newPassword" type="password" placeholder="New password (10+ characters)" autocomplete="new-password" minlength="10" required><p class="err"></p><button class="b" style="width:100%">Save password</button>${forced?'':'<button type="button" class="b g" id="cx" style="width:100%;margin-top:8px">Cancel</button>'}</form></div>`;
 const cx=$('#cx');if(cx)cx.onclick=()=>shell();
 $('form',root).onsubmit=async e=>{e.preventDefault();try{await api('/api/staff/password',{method:'POST',body:Object.fromEntries(new FormData(e.target))});shell()}catch(x){if(x.message!=='auth')$('.err',root).textContent=x.message}}}

async function shell(){
 ME=(await api('/api/staff/me')).staff;if(ME.mustChange)return forceChange();[summary,DIR]=await Promise.all([api('/api/staff/summary'),api('/api/staff/directory').then(x=>x.staff)]);
 root.innerHTML=`<header class="bar"><b>Xpress · Staff</b><nav class="tabs">${[['chats','Live chat',summary.unreadChats],['quotes','Quotes',summary.newQuotes],['schedule','Schedule',0],['reviews','Reviews',0],['customers','Customers',0],...(ME.role==='owner'?[['team','Team',0]]:[])].map(([k,l,n])=>`<button data-t="${k}" aria-selected="${tab===k}">${l}${n?`<span class="badge">${n}</span>`:''}</button>`).join('')}</nav>
 <label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="avail" ${summary.available?'checked':''}> Chat available <span class="muted" style="color:#aaa">(${summary.chat.online?'showing Online':'showing Away'})</span></label><span style="display:flex;gap:12px;align-items:center;font-size:13px"><span>${esc(ME.name)} <small style="color:#aaa">${ME.role}</small></span><a href="#" id="pwl" style="color:#ccc">Password</a><a href="#" id="so" style="color:#ccc">Sign out</a></span></header><div class="wrap" id="view"></div>`;
 $('#so').onclick=async e=>{e.preventDefault();await fetch('/api/staff/logout',{method:'POST'});ME=null;login()};$('#pwl').onclick=e=>{e.preventDefault();forceChange(false)};
 root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sel=null;shell()});
 $('#avail').onchange=e=>api('/api/staff/availability',{method:'POST',body:{available:e.target.checked}}).then(shell);
 ({chats,quotes,schedule,reviews,customers,team})[tab]();
 clearInterval(poll);poll=setInterval(()=>{if(tab==='chats')refreshChats(true);else if(tab==='quotes'&&!document.activeElement.closest?.('.form'))null},5000);
}

async function chats(){
 $('#view').innerHTML=`<div class="stats"><div class="stat"><b>${summary.openChats}</b>Open chats</div><div class="stat"><b>${summary.unreadChats}</b>Waiting for reply</div><div class="stat"><b>${summary.newQuotes}</b>New quotes</div><div class="stat"><b>${summary.customers}</b>Customers</div></div>
 <div class="cols"><div class="card list" id="clist" style="padding:0"></div><div class="card" id="cview"><p class="muted">Select a conversation.</p></div></div>`;
 await refreshChats();
}
async function refreshChats(quiet){
 const list=await api('/api/staff/chats');const box=$('#clist');if(!box)return;
 box.innerHTML=list.length?list.map(c=>`<div class="item ${sel===c.id?'sel':''}" data-id="${c.id}"><div class="n"><span>${esc(c.name)}</span>${c.unread_staff?`<span class="unread">${c.unread_staff}</span>`:`<small>${ago(c.last_at)}</small>`}</div><small>${esc(c.topic)}${c.status==='closed'?' · closed':''}</small><small>${esc(c.last||'')}</small></div>`).join(''):'<p class="muted" style="padding:18px">No chats yet.</p>';
 box.querySelectorAll('.item').forEach(i=>i.onclick=()=>{sel=+i.dataset.id;after=0;openChat()});
 if(sel&&quiet)appendChat();
}
async function openChat(){
 const d=await api('/api/staff/chats/'+sel);$('#cview').innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div><b>${esc(d.name)}</b><br><span class="muted">${esc(d.email)} · ${esc(d.topic)}</span></div><div><button class="b g" id="cl">${d.status==='closed'?'Reopen':'Close chat'}</button></div></div><div class="thread" id="th"></div>
 <form class="reply"><input name="message" placeholder="Reply to ${esc(d.name)}…" autocomplete="off" autofocus><button class="b">Send</button></form>`;
 after=0;drawMsgs(d.messages);
 $('#cl').onclick=async()=>{await api('/api/staff/chats/'+sel,{method:'PATCH',body:{status:d.status==='closed'?'open':'closed'}});openChat();refreshChats()};
 $('.reply').onsubmit=async e=>{e.preventDefault();const v=e.target.message.value.trim();if(!v)return;e.target.message.value='';await api('/api/staff/chats/'+sel,{method:'POST',body:{message:v}});appendChat()};
 refreshChats();
}
function drawMsgs(list){const th=$('#th');if(!th)return;for(const m of list){if(m.id<=after)continue;after=m.id;const d=document.createElement('div');d.className='m '+m.sender;d.innerHTML=`${m.sender==='staff'&&m.staffName?`<b style="font-size:11px;opacity:.8">${esc(m.staffName)}</b>`:''}<p>${esc(m.body).replace(/\n/g,'<br>')}</p><time>${t(m.at)}</time>`;th.append(d)}th.scrollTop=th.scrollHeight}
async function appendChat(){const d=await api(`/api/staff/chats/${sel}?after=${after}`);drawMsgs(d.messages)}

async function quotes(){
 const list=await api('/api/staff/quotes'),shown=list.filter(q=>!window.__mine||q.assignedTo===ME.id);
 $('#view').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Quote requests</h2><label style="font-weight:700"><input type="checkbox" id="mine" ${window.__mine?'checked':''}> Only mine</label></div><table><thead><tr><th>Ref</th><th>Customer</th><th>Service</th><th>Where</th><th>Status</th><th>Received</th></tr></thead><tbody>${shown.map(q=>`<tr class="click" data-ref="${q.ref}"><td><b>${q.ref}</b>${q.urgent?'<br><span class="urg">URGENT</span>':''}</td><td>${esc(q.name)}<br><small class="muted">${esc(q.phone)}</small>${q.assignedName?`<br><small class="muted">→ ${esc(q.assignedName.split(' ')[0])}</small>`:''}</td><td>${esc(q.service)}${q.invoices.some(i=>i.status==='open')?' <span class="pill s-new" title="awaiting payment">$ due</span>':q.invoices.some(i=>i.status==='paid')?' <span class="pill s-completed" title="paid">$ paid</span>':''}${q.photos.length?` <span title="photos">📷${q.photos.length}</span>`:''}</td><td>${esc(q.city)}, ${esc(q.state)}</td><td><span class="pill s-${q.status}">${q.status}</span></td><td>${ago(q.createdAt)} ago</td></tr>`).join('')||'<tr><td colspan=6 class="muted">No quote requests yet.</td></tr>'}</tbody></table></div><div id="qd"></div>`;
 $('#mine').onchange=e=>{window.__mine=e.target.checked;quotes()};
 root.querySelectorAll('tr.click').forEach(r=>r.onclick=()=>{const q=list.find(x=>x.ref===r.dataset.ref);$('#qd').innerHTML=`<div class="card" style="margin-top:16px"><h2>${q.ref} · ${esc(q.service)}</h2><p>${esc(q.name)} · <a href="tel:${esc(q.phone)}">${esc(q.phone)}</a> · <a href="mailto:${esc(q.email)}">${esc(q.email)}</a> ${q.hasAccount?'· <span class="pill s-completed">has account</span>':''}</p><p>${esc(q.message)}</p>${q.photos.length?`<div class="thumbs" id="ph">${q.photos.map(p=>`<a href="#" data-ph="${p.id}" data-mime="${p.mime}" title="${esc(p.name)}"><img alt="${esc(p.name)}"></a>`).join('')}</div>`:''}${q.status==='completed'?`<div style="margin:10px 0;padding:10px 12px;background:#fff7f2;border:1px solid #ffd9c7;border-radius:12px"><b>Review</b> · ${q.review&&q.review.rating?`<span style="color:${q.review.rating<=3?'#b3261e':'#ef4b00'}">${'★'.repeat(q.review.rating)+'☆'.repeat(5-q.review.rating)}</span> ${esc(q.review.comment)}`:q.review&&q.review.sentAt?'requested, no answer yet':'not requested yet'}<div style="margin-top:8px;display:flex;gap:8px"><button class="b g" type="button" data-rv="send">Email review request</button><button class="b g" type="button" data-rv="link">Copy review link</button></div></div>`:''}<p class="muted">Prefers: ${esc(q.prefDate||'any date')} ${esc(q.prefTime||'')}</p>
 <form class="form"><label>Status<select name="status">${['new','reviewing','quoted','scheduled','completed','cancelled'].map(s=>`<option ${q.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Assigned to<select name="assignedTo"><option value="">Unassigned</option>${DIR.map(s=>`<option value="${s.id}" ${q.assignedTo===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>Quote amount<input name="quoteAmount" value="${esc(q.quoteAmount)}" placeholder="$285 – $340"></label><label>Appointment day<input name="slotDate" type="date" value="${esc(q.slotDate)}"></label><label>Arrival window<select name="slotWindow"><option value="">—</option>${['8am–10am','10am–12pm','12pm–2pm','2pm–4pm'].map(w=>`<option ${q.slotWindow===w?'selected':''}>${w}</option>`).join('')}</select></label><label>Appointment note (shown to customer)<input name="scheduledFor" value="${esc(q.scheduledFor)}" placeholder="auto-filled from day + window"></label><label style="grid-column:1/-1">Internal note (customers can’t see)<textarea name="staffNote" rows="2">${esc(q.staffNote)}</textarea></label><div><button class="b">Save &amp; notify customer</button> <span id="sv" class="muted"></span></div></form><h2 style="margin:20px 0 8px;font-size:16px">Payments</h2><div id="pays">${q.invoices.length?q.invoices.map(i=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eee;flex-wrap:wrap"><b style="width:90px">${esc(i.amount)}</b><span class="muted" style="flex:1">${esc(i.kind)}${i.description?' · '+esc(i.description):''}</span>${i.dueDate&&i.status==='open'?`<span class="muted">due ${esc(i.dueDate)}</span>`:''}${i.refundedCents?`<span class="muted">refunded ${esc(i.refunded)}</span>`:''}<span class="pill s-${['paid'].includes(i.status)?'completed':['void','refunded'].includes(i.status)?'cancelled':'new'}">${i.status}${i.status==='paid'?' · '+esc(i.method):''}</span><a href="#" data-rc="${i.id}" class="muted">${i.status==='open'?'invoice':'receipt'}</a>${i.status==='paid'&&ME.role==='owner'?`<button class="b g" data-refund="${i.id}" data-left="${(i.amountCents-i.refundedCents)/100}">Refund</button>`:''}${i.status==='open'?`<select data-m="${i.id}"><option value="cash">cash</option><option value="check">check</option><option value="card-in-person">card in person</option><option value="other">other</option></select><button class="b g" data-paid="${i.id}">Mark paid</button><button class="b g" data-void="${i.id}">Void</button>`:''}</div>`).join(''):'<p class="muted">No payment requests yet.</p>'}</div><form id="nf" class="form" style="grid-template-columns:110px 130px 1fr;align-items:end"><label>Type<select name="kind"><option value="deposit">Deposit</option><option value="payment">Payment</option></select></label><label>Total amount ($)<input name="amount" inputmode="decimal" placeholder="100.00" required></label><label>For<input name="description" placeholder="e.g. Spring replacement"></label><label>Due date (optional)<input name="dueDate" type="date"></label><label>Split into installments<select name="installments"><option value="1">Single payment</option>${[2,3,4,5,6].map(n=>`<option value="${n}">${n} installments</option>`).join('')}</select></label><label>Installments every<select name="everyDays"><option value="30">month</option><option value="14">2 weeks</option><option value="7">week</option></select></label><div style="grid-column:1/-1"><button class="b">Request payment</button></div></form><p class="muted" style="font-size:12px;margin:6px 0 0">The customer is emailed and can pay by card from their account; reminders go out automatically before and after the due date. Card refunds are sent through Stripe from the Refund button.</p></div>`;
 root.querySelectorAll('#ph a').forEach(async a=>{try{const r=await fetch('/api/staff/photos/'+a.dataset.ph);const u=URL.createObjectURL(await r.blob());a.querySelector('img').src=a.dataset.mime==='image/heic'?'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="#eee"/><text x="48" y="52" text-anchor="middle" font-size="12" fill="#555">HEIC</text></svg>'):u;a.href=u;a.target='_blank';a.download=a.dataset.mime==='image/heic'?'photo-'+a.dataset.ph+'.heic':'';a.onclick=null}catch{}});
 const again=async()=>{await quotes();document.querySelector(`tr[data-ref="${q.ref}"]`)?.click()};
 $('#nf').onsubmit=async e=>{e.preventDefault();try{await api(`/api/staff/quotes/${q.ref}/invoices`,{method:'POST',body:Object.fromEntries(new FormData(e.target))});again()}catch(x){alert(x.message)}};
 root.querySelectorAll('[data-paid]').forEach(b=>b.onclick=async()=>{if(confirm('Record this as paid offline?')){await api('/api/staff/invoices/'+b.dataset.paid,{method:'PATCH',body:{action:'mark_paid',method:root.querySelector(`[data-m="${b.dataset.paid}"]`).value}});again()}});
 root.querySelectorAll('[data-rc]').forEach(a=>a.onclick=async e=>{e.preventDefault();const r=await fetch('/api/staff/invoices/'+a.dataset.rc+'/receipt');window.open(URL.createObjectURL(await r.blob()),'_blank')});
 root.querySelectorAll('[data-refund]').forEach(b=>b.onclick=async()=>{const v=prompt('Refund how much? (max $'+b.dataset.left+')',b.dataset.left);if(v===null)return;try{await api('/api/staff/invoices/'+b.dataset.refund,{method:'PATCH',body:{action:'refund',amount:v}});again()}catch(x){alert(x.message)}});
 root.querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{try{const r=await api(`/api/staff/quotes/${q.ref}/review`,{method:'POST',body:{action:b.dataset.rv}});if(b.dataset.rv==='link'){try{await navigator.clipboard.writeText(r.link)}catch{}prompt('Review link (copy it and send it to the customer):',r.link)}else{alert(r.emailSent?'Review request emailed.':'Email isn’t set up on the server, so nothing was sent. Use “Copy review link” and send it yourself.');again()}}catch(x){alert(x.message)}});
 root.querySelectorAll('[data-void]').forEach(b=>b.onclick=async()=>{if(confirm('Cancel this payment request?')){await api('/api/staff/invoices/'+b.dataset.void,{method:'PATCH',body:{action:'void'}});again()}});
 $('#qd form:not(#nf)').onsubmit=async e=>{e.preventDefault();await api('/api/staff/quotes/'+q.ref,{method:'PATCH',body:(f=>{if(!f.slotDate){f.slotDate='';f.slotWindow=''}if(f.slotDate===q.slotDate&&f.slotWindow===q.slotWindow&&f.scheduledFor===q.scheduledFor)delete f.scheduledFor;return f})(Object.fromEntries(new FormData(e.target)))});$('#sv').textContent='Saved ✓';setTimeout(()=>shell(),600)};$('#qd').scrollIntoView({behavior:'smooth'})});
}

const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
async function schedule(){
 const d=await api('/api/staff/schedule?days=21'),s=d.settings,byDay={};d.bookings.forEach(b=>{(byDay[b.date]??=[]).push(b)});
 const fmtD=v=>new Date(v+'T12:00').toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});
 $('#view').innerHTML=`<div class="cols" style="grid-template-columns:1fr 340px"><div class="card"><h2>Next 3 weeks</h2>${Object.keys(byDay).sort().map(k=>`<h3 style="margin:16px 0 6px;font-size:14px">${fmtD(k)}</h3>${d.windows.map(w=>{const list=byDay[k].filter(b=>b.win===w);return list.length?`<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #eee"><b style="width:90px;flex:none">${w}</b><div style="flex:1">${list.map(b=>`<div><b>${esc(b.ref)}</b> ${esc(b.name)} · ${esc(b.service)} · ${esc(b.city)}, ${esc(b.state)} <span class="pill s-${b.status}">${b.status}</span> <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a></div>`).join('')}</div></div>`:''}).join('')}`).join('')||'<p class="muted">No appointments booked in the next 3 weeks.</p>'}</div>
 <div class="card"><h2>Availability settings</h2><form id="sf" class="form" style="grid-template-columns:1fr"><div><b style="font-size:12px">Crews per arrival window</b><div style="display:flex;gap:8px;margin-top:4px">${['PA','NJ','LA'].map(st=>`<label>${st}<input name="cap${st}" type="number" min="0" max="20" value="${s.capacity[st]}" style="width:70px"></label>`).join('')}</div><small class="muted">How many jobs can start in the same 2-hour window.</small></div>
 <div><b style="font-size:12px">Days we take bookings</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${DAYS.map((n,i)=>`<label style="flex-direction:row;gap:3px;align-items:center"><input type="checkbox" name="day" value="${i}" ${s.openDays.includes(i)?'checked':''}>${n}</label>`).join('')}</div></div>
 <label>Minimum notice (hours)<input name="lead" type="number" min="0" max="72" value="${s.leadHours}"></label>
 <div><b style="font-size:12px">Days off / holidays</b><div id="bo" style="margin:6px 0">${s.blackouts.map(v=>`<span class="pill" style="margin-right:4px">${v} <a href="#" data-rm="${v}">✕</a></span>`).join('')||'<span class="muted">None</span>'}</div><div style="display:flex;gap:6px"><input type="date" id="nb"><button type="button" class="b g" id="addbo">Add</button></div></div>
 <div><button class="b">Save settings</button> <span class="muted" id="ss"></span></div></form></div></div>`;
 let blackouts=[...s.blackouts];const save=async()=>{const f=$('#sf');await api('/api/staff/schedule/settings',{method:'PUT',body:{capacity:{PA:+f.capPA.value,NJ:+f.capNJ.value,LA:+f.capLA.value},openDays:[...f.querySelectorAll('[name=day]:checked')].map(x=>+x.value),leadHours:+f.lead.value,blackouts}});$('#ss').textContent='Saved ✓'};
 if(ME.role!=='owner'){$('#sf').querySelectorAll('input,button').forEach(x=>x.disabled=true);$('#ss').textContent='Only owners can change availability.'}
 $('#sf').onsubmit=e=>{e.preventDefault();save()};$('#addbo').onclick=()=>{const v=$('#nb').value;if(v&&!blackouts.includes(v)){blackouts.push(v);save().then(schedule)}};
 root.querySelectorAll('[data-rm]').forEach(x=>x.onclick=e=>{e.preventDefault();blackouts=blackouts.filter(v=>v!==x.dataset.rm);save().then(schedule)});
}

async function reviews(){
 const d=await api('/api/staff/reviews'),s=d.stats,stars=n=>'★'.repeat(n)+'☆'.repeat(5-n),when=v=>v?new Date(v).toLocaleDateString([],{month:'short',day:'numeric'}):'';
 $('#view').innerHTML=`<div class="stats"><div class="stat"><b>${s.avg||'—'}</b>Average rating</div><div class="stat"><b>${s.responded}</b>Ratings received</div><div class="stat"><b>${s.sent?Math.round(s.responded/s.sent*100)+'%':'—'}</b>Response rate (${s.sent} asked)</div><div class="stat"><b style="color:${s.low?'#b3261e':'inherit'}">${s.low}</b>3 stars or lower</div><div class="stat"><b>${s.publicClicks}</b>Went to Google</div><div class="stat"><b>${d.onSite}</b>Shown on website</div></div>
 ${s.googleLink?'':'<div class="card" style="margin-bottom:14px;background:#fff7d6"><b>Google reviews link not set.</b> Add <code>REVIEW_GOOGLE_URL</code> to the server settings so thankful customers can share publicly.</div>'}
 <div class="card"><h2>Customer feedback</h2>${d.list.length?`<table><tbody>${d.list.map(r=>`<tr><td style="width:120px;white-space:nowrap;color:${r.rating?(r.rating<=3?'#b3261e':'#ef4b00'):'#999'};font-size:16px">${r.rating?stars(r.rating):'<span class="muted" style="font-size:13px">awaiting</span>'}</td><td><b>${esc(r.name)}</b> <span class="muted">${esc(r.ref)} · ${esc(r.service)} · ${esc(r.city)}, ${esc(r.state)}</span>${r.comment?`<br>${esc(r.comment)}`:''}</td><td class="muted" style="width:110px;text-align:right">${r.rating?when(r.respondedAt)+' via '+esc(r.via):'asked '+when(r.sentAt)}</td><td style="width:150px;text-align:right">${r.rating&&r.comment&&r.comment.trim().length>=10?(r.publicOk?`<label style="font-weight:700;white-space:nowrap"><input type="checkbox" data-feat="${esc(r.ref)}" ${r.featured?'checked':''}> On website</label>`:'<span class="muted" style="font-size:12px">Not allowed to show publicly</span>'):''}</td></tr>`).join('')}</tbody></table><p class="muted" style="font-size:12px;margin:12px 0 0">Only reviews with a written comment where the customer agreed to public display can go on the website. Their words are shown exactly as written. The star average on the site counts <b>every</b> rating, not only the ones shown. If a customer edits their review, it comes off the website until you approve it again.</p>`:'<p class="muted">No review requests yet. They go out automatically a few hours after you mark a job completed.</p>'}</div>`;
 root.querySelectorAll('[data-feat]').forEach(c=>c.onchange=async()=>{try{await api('/api/staff/reviews/'+c.dataset.feat,{method:'PATCH',body:{featured:c.checked}});reviews()}catch(x){alert(x.message);c.checked=!c.checked}});
}

async function team(){
 const d=await api('/api/staff/team'),when=v=>v?new Date(v).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'never';
 $('#view').innerHTML=`<div class="cols" style="grid-template-columns:1fr 380px"><div class="card"><h2>Team</h2><table><thead><tr><th>Name</th><th>Role</th><th>Last sign-in</th><th></th></tr></thead><tbody>${d.staff.map(s=>`<tr><td><b>${esc(s.name)}</b>${s.id===ME.id?' <span class="muted">(you)</span>':''}<br><small class="muted">${esc(s.email)}</small></td><td>${s.active?`<select data-role="${s.id}" ${s.id===ME.id?'disabled':''}><option ${s.role==='staff'?'selected':''}>staff</option><option ${s.role==='owner'?'selected':''}>owner</option></select>`:'<span class="pill s-cancelled">disabled</span>'}</td><td>${when(s.lastLogin)}${s.mustChange?'<br><small class="urg">must set password</small>':''}</td><td style="white-space:nowrap">${s.id===ME.id?'':`<button class="b g" data-reset="${s.id}">Reset password</button> <button class="b g" data-toggle="${s.id}" data-on="${s.active?1:0}">${s.active?'Deactivate':'Reactivate'}</button>`}</td></tr>`).join('')}</tbody></table><p class="muted" style="font-size:12px">Staff can run chats, quotes, schedule and customers, and request or record payments. Owners can also refund, change availability and manage the team.</p></div>
 <div class="card"><h2>Add a team member</h2><form id="tf" class="form" style="grid-template-columns:1fr"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option value="staff">Staff</option><option value="owner">Owner</option></select></label><div><button class="b">Create account</button></div></form><div id="tp"></div></div></div>
 <div class="card" style="margin-top:16px"><h2>Recent activity</h2><table><tbody>${d.audit.map(a=>`<tr><td class="muted" style="width:130px">${when(a.at)}</td><td><b>${esc(a.who||'—')}</b></td><td>${esc(a.action)}</td><td class="muted">${esc(a.target)} ${esc(a.detail)}</td></tr>`).join('')||'<tr><td class="muted">Nothing yet.</td></tr>'}</tbody></table></div>`;
 const showTemp=(who,pw)=>{$('#tp').innerHTML=`<div style="margin-top:14px;padding:12px;background:#fff7d6;border-radius:12px"><b>Temporary password for ${esc(who)}</b><br><code style="font-size:16px;user-select:all">${esc(pw)}</code><p class="muted" style="font-size:12px;margin:6px 0 0">Shown once. Share it privately (in person or a call). They must choose their own password at first sign-in.</p></div>`};
 $('#tf').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/staff/team',{method:'POST',body:Object.fromEntries(new FormData(e.target))});await team();showTemp(r.staff.name+' ('+r.staff.email+')',r.tempPassword)}catch(x){alert(x.message)}};
 root.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{try{await api('/api/staff/team/'+s.dataset.role,{method:'PATCH',body:{role:s.value}});team()}catch(x){alert(x.message);team()}});
 root.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const on=b.dataset.on==='1';if(confirm(on?'Deactivate this person? They are signed out immediately.':'Reactivate this account?')){await api('/api/staff/team/'+b.dataset.toggle,{method:'PATCH',body:{active:!on}});team()}});
 root.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{if(confirm('Reset this password? They are signed out and must choose a new one.')){const r=await api('/api/staff/team/'+b.dataset.reset,{method:'PATCH',body:{resetPassword:true}});await team();showTemp(r.staff.name,r.tempPassword)}});
}

async function customers(){
 const list=await api('/api/staff/customers');
 $('#view').innerHTML=`<div class="card"><h2>Customers</h2><table><thead><tr><th>Name</th><th>Contact</th><th>Area</th><th>Requests</th><th>Jobs done</th><th>Joined</th></tr></thead><tbody>${list.map(c=>`<tr class="click" data-id="${c.id}"><td><b>${esc(c.name)}</b></td><td>${esc(c.email)}<br><small class="muted">${esc(c.phone)}</small></td><td>${esc(c.city)} ${esc(c.state)}</td><td>${c.quotes}</td><td>${c.jobs}</td><td>${ago(c.created_at)} ago</td></tr>`).join('')||'<tr><td colspan=6 class="muted">No customer accounts yet.</td></tr>'}</tbody></table></div><div id="cd"></div>`;
 root.querySelectorAll('tr.click').forEach(r=>r.onclick=async()=>{const d=await api('/api/staff/customers/'+r.dataset.id),c=d.customer;$('#cd').innerHTML=`<div class="card" style="margin-top:16px"><h2>${esc(c.name)}</h2><p>${esc(c.email)} · ${esc(c.phone)}<br>${esc(c.address)} ${esc(c.city)} ${esc(c.state)}</p><p class="muted">Door notes: ${esc(c.doorNotes)||'—'}</p><h2 style="margin-top:18px;font-size:16px">History</h2>${d.quotes.map(q=>`<p><b>${q.ref}</b> · ${esc(q.service)} · <span class="pill s-${q.status}">${q.status}</span> ${esc(q.quoteAmount)} <span class="muted">${t(q.createdAt)}</span></p>`).join('')||'<p class="muted">None.</p>'}<h2 style="margin-top:18px;font-size:16px">Private notes</h2>${d.notes.map(n=>`<p>${esc(n.body)} <span class="muted">${t(n.at)}</span></p>`).join('')}<form class="reply"><input name="body" placeholder="Add a note (e.g. spring replaced 2026, gate code…)"><button class="b">Add</button></form></div>`;
 $('#cd form').onsubmit=async e=>{e.preventDefault();await api(`/api/staff/customers/${c.id}/notes`,{method:'POST',body:{body:e.target.body.value}});r.click()};$('#cd').scrollIntoView({behavior:'smooth'})});
}
shell().catch(()=>{});
</script></body></html>
