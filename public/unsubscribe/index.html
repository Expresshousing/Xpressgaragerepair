<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe | Xpress Garage Doors</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="/assets/cropped-logo-1-32x32.png">
<style>body{margin:0;font-family:Manrope,Arial,sans-serif;background:#f6f4f4;color:#111}.top{background:#fff;border-bottom:1px solid #e8e5e3;padding:16px 5vw}.top a{font-weight:800;font-size:20px;text-decoration:none;color:inherit}main{max-width:480px;margin:8vh auto;padding:0 20px}.card{background:#fff;border:1px solid #e8e5e3;border-radius:24px;padding:32px}h1{font-size:28px;margin:0 0 8px}p{color:#555;line-height:1.5}.btn{display:block;background:#ef4b00;color:#fff;border:0;border-radius:30px;padding:14px;font:800 15px inherit;font-family:inherit;width:100%;cursor:pointer;margin-top:16px;text-align:center;text-decoration:none}.btn.ghost{background:#fff;color:#111;border:1px solid #cfc9c6}</style></head><body>
<div class="top"><a href="/">Xpress Garage</a></div>
<main><div class="card" id="c"><h1>Unsubscribe from reminder emails?</h1><p>You’ll stop getting yearly check-up reminders and review follow-ups. We’ll still email you about your quotes, appointments, payments and chat replies, because those are about work you asked for.</p><button class="btn" id="go">Yes, unsubscribe me</button><a class="btn ghost" href="/">Cancel</a></div></main>
<script>
const t=new URLSearchParams(location.search).get('t')||'',c=document.getElementById('c');
document.getElementById('go').onclick=async()=>{try{const r=await fetch('/api/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t})}),j=await r.json();if(!r.ok)throw 0;c.innerHTML='<h1>You’re unsubscribed</h1><p>We won’t send reminder emails to that address any more. Changed your mind? Sign in to your <a href="/account/">account</a> and turn reminders back on.</p><a class="btn ghost" href="/">Back to website</a>'}catch{c.innerHTML='<h1>That link isn’t valid</h1><p>Please use the unsubscribe link from the email, or call us at 215-397-1926 and we’ll take care of it.</p>'}};
</script></body></html>
