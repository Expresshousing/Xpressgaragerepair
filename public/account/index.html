<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | Xpress Garage Doors</title><meta name="robots" content="noindex"><link rel="icon" href="/assets/cropped-logo-1-32x32.png"><link rel="stylesheet" href="/portal.css">
<style>
body{margin:0;font-family:Manrope,Arial,sans-serif;background:#f6f4f4;color:#111}
a{color:inherit}.top{background:#fff;border-bottom:1px solid var(--xp-line);padding:16px 5vw;display:flex;justify-content:space-between;align-items:center}
.top a.logo{font-weight:800;font-size:20px;text-decoration:none;letter-spacing:-.03em}.top nav{display:flex;gap:18px;align-items:center;font-size:14px;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:34px 5vw 90px}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.04em;margin:0 0 6px}.sub{color:var(--xp-mut);margin:0 0 26px}
.card{background:#fff;border:1px solid var(--xp-line);border-radius:22px;padding:26px;margin-bottom:18px}.card h2{margin:0 0 14px;font-size:20px}
.auth{max-width:440px;margin:30px auto}.tabs{display:flex;gap:6px;background:#eee9e6;border-radius:30px;padding:4px;margin-bottom:18px}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:30px;font:700 14px inherit;font-family:inherit;cursor:pointer}.tabs button[aria-selected=true]{background:#fff;box-shadow:0 2px 8px #0001}
.ap{display:flex;flex-direction:column;gap:14px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
.err{color:#b3261e;font-size:13px;min-height:18px}.ok{color:#1a7f37;font-size:13px}
.q{border:1px solid var(--xp-line);border-radius:16px;padding:18px;margin-bottom:12px}.q header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:800;padding:5px 12px;border-radius:30px;background:#eee;white-space:nowrap}.s-new,.s-reviewing{background:#fff1ea;color:#b53b00}.s-quoted{background:#e8f0ff;color:#1c4fb5}.s-scheduled{background:#e5f6ea;color:#1a7f37}.s-completed{background:#e5f6ea;color:#1a7f37}.s-cancelled{background:#eee;color:#666}
.steps{display:flex;gap:6px;margin:14px 0 4px}.steps i{flex:1;height:5px;border-radius:5px;background:#e8e5e3}.steps i.on{background:var(--xp)}
.tl{list-style:none;margin:12px 0 0;padding:0;font-size:13px;color:var(--xp-mut)}.tl li{padding:3px 0}.tl b{color:#111}
.meta{color:var(--xp-mut);font-size:14px;margin:6px 0}.big{font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--xp-line);border-radius:18px;padding:18px}.stat b{display:block;font-size:26px}
.empty{color:var(--xp-mut);padding:10px 0}
.rv{margin:12px 0;padding:12px 14px;background:#fff7f2;border:1px solid #ffd9c7;border-radius:14px}.rvs{display:flex;gap:2px;margin:4px 0}.rvb{border:0;background:none;font-size:30px;line-height:1;color:#d9d4d1;cursor:pointer;padding:2px 3px}.rvb.on{color:#ef4b00}.rvx textarea{margin-top:8px}
.pay{margin:12px 0;padding:12px 14px;background:#f6f4f4;border-radius:14px}.payhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid #e8e5e3}
</style></head><body>
<div class="top"><a class="logo" href="/">Xpress Garage</a><nav><a href="/">Website</a><a href="/contact-us/">Get a quote</a><a href="#" id="out" hidden>Sign out</a></nav></div>
<main id="app"></main>
<script src="/chat.js" defer></script><script src="/booking.js" defer></script><script src="/photos.js" defer></script>
<script>
const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,o={})=>{const r=await fetch(u,{headers:{'content-type':'application/json'},...o,body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'Something went wrong'),{status:r.status,code:d.code});return d};
const ORDER=['new','reviewing','quoted','scheduled','completed'];
const fmt=d=>new Date(d).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
const fmtT=d=>new Date(d).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const qs=new URLSearchParams(location.search);

function forgotView(){
  app.innerHTML=`<div class="card auth"><h1 style="font-size:32px">Reset your password</h1><p class="sub">Enter your email and we’ll send you a link to choose a new password.</p><form class="ap" novalidate><label class="xp-field">Email<input name="email" type="email" autocomplete="email" required value="${esc(qs.get('email')||'')}"></label><p class="err" role="alert"></p><button class="xp-btn" type="submit">Send reset link</button></form><p class="meta"><a href="/account/" id="back">Back to sign in</a></p></div>`;
  $('#back').onclick=e=>{e.preventDefault();authView('login')};
  $('form',app).onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/forgot',{method:'POST',body:Object.fromEntries(new FormData(e.target))});app.innerHTML=`<div class="card auth"><h1 style="font-size:32px">Check your email</h1><p class="sub">If an account exists for that email, a reset link is on its way. It works for 1 hour. Nothing arrived? Check spam, or <a href="#" data-open-chat>chat with us</a>.</p><p class="meta"><a href="/account/">Back to sign in</a></p></div>`}catch(x){$('.err',app).textContent=x.message}};
}
function resetView(token){
  app.innerHTML=`<div class="card auth"><h1 style="font-size:32px">Choose a new password</h1><form class="ap" novalidate><label class="xp-field">New password (8+ characters)<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><label class="xp-field">Confirm password<input name="confirm" type="password" autocomplete="new-password" required></label><p class="err" role="alert"></p><button class="xp-btn" type="submit">Save and sign in</button></form></div>`;
  $('form',app).onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.password!==f.confirm)return $('.err',app).textContent='Passwords don’t match.';try{await api('/api/auth/reset',{method:'POST',body:{token,password:f.password}});history.replaceState(null,'','/account/');load()}catch(x){$('.err',app).innerHTML=esc(x.message)+(x.status===410?' <a href="#" id="again">Request a new link</a>':'');const ag=$('#again');if(ag)ag.onclick=ev=>{ev.preventDefault();history.replaceState(null,'','/account/');forgotView()}}};
}
function authView(mode=qs.get('mode')==='signup'?'signup':'login'){
  app.innerHTML=`<div class="card auth"><h1 style="font-size:32px">${mode==='signup'?'Create your account':'Welcome back'}</h1><p class="sub">${mode==='signup'?'Track your quotes, see appointments and message our team in one place.':'Sign in to see your quotes, appointments and messages.'}</p>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${mode==='login'}" data-m="login">Sign in</button><button role="tab" aria-selected="${mode==='signup'}" data-m="signup">Create account</button></div>
  <form class="ap" novalidate>${mode==='signup'?'<label class="xp-field">Full name<input name="name" autocomplete="name" required></label>':''}
  <label class="xp-field">Email<input name="email" type="email" autocomplete="email" required value="${esc(qs.get('email')||'')}"></label>
  ${mode==='signup'?'<label class="xp-field">Phone (optional)<input name="phone" type="tel" autocomplete="tel"></label>':''}
  <label class="xp-field">Password${mode==='signup'?' (8+ characters)':''}<input name="password" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" required></label>
  <p class="err" role="alert"></p><button class="xp-btn" type="submit">${mode==='signup'?'Create account':'Sign in'}</button>${mode==='login'?'<a href="#" id="forgot" style="text-align:center;font-size:13px;font-weight:700">Forgot your password?</a>':''}</form>
  ${mode==='signup'?'<p class="meta">Already requested a quote with this email? It will appear in your account automatically.</p>':''}</div>`;
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>authView(b.dataset.m));
  const fg=$('#forgot');if(fg)fg.onclick=e=>{e.preventDefault();forgotView()};
  $('form',app).onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(mode==='signup'){try{const c=JSON.parse(localStorage.getItem('xp_claim')||'null');if(c&&Date.now()-c.at<864e5)f.claim={ref:c.ref,token:c.token}}catch{}f.chatToken=localStorage.getItem('xp_chat_token')||undefined}try{await api('/api/auth/'+(mode==='signup'?'signup':'login'),{method:'POST',body:f});if(mode==='signup')localStorage.removeItem('xp_claim');history.replaceState(null,'','/account/');load()}catch(x){$('.err',app).textContent=x.message}};
}

const KIND={deposit:'Deposit',payment:'Payment',installment:'Installment'};
function payHTML(q){
  const live=q.invoices.filter(i=>i.status!=='void'),open=live.filter(i=>i.status==='open'),due=open.reduce((a,i)=>a+i.amountCents,0),paid=live.filter(i=>['paid','refunded'].includes(i.status)).reduce((a,i)=>a+i.amountCents-i.refundedCents,0),usd=c=>'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2});
  const today=new Date().toISOString().slice(0,10),dd=v=>new Date(v+'T12:00').toLocaleDateString([],{month:'short',day:'numeric'});
  return `<div class="pay"><div class="payhead"><b>${live.length>1?'Payment plan':'Payments'}</b><span class="meta">${paid?`Paid ${usd(paid)}`:''}${paid&&due?' · ':''}${due?`<b style="color:#b53b00">Due ${usd(due)}</b>`:''}</span></div>${live.map(i=>{const late=i.status==='open'&&i.dueDate&&i.dueDate<today;return `<div class="payrow"><div><b>${esc(i.amount)}</b> <span class="meta">${KIND[i.kind]||'Payment'}${i.description?' · '+esc(i.description):''}</span><br><span class="meta">${i.status==='open'&&i.dueDate?`<span style="${late?'color:#b3261e;font-weight:700':''}">${late?'Overdue · was due ':'Due '}${dd(i.dueDate)}</span> · `:''}${['paid','refunded'].includes(i.status)?`Paid ${fmt(i.paidAt)} · ${i.method==='card'?'card':esc(i.method)}`:''}${i.refundedCents?` · <b>Refunded ${esc(i.refunded)}</b>`:''} <a href="/api/me/invoices/${i.id}/receipt" target="_blank" rel="noopener">${i.status==='open'?'Invoice':'Receipt'}</a></span></div>${i.status==='open'?`<button class="xp-btn" data-pay="${i.id}">Pay ${esc(i.amount)} securely</button>`:i.status==='refunded'?`<span class="pill s-cancelled">Refunded</span>`:`<span class="pill s-completed">Paid ✓</span>`}</div>`}).join('')}${due?'<p class="meta" style="margin:8px 0 0">Card payments are handled on Stripe’s secure page; we never see your card number. Prefer to pay your technician? That’s fine too.</p>':''}</div>`;
}
function reviewHTML(q){
  const r=q.review&&q.review.rating?q.review.rating:0;
  return `<div class="rv" data-rv="${esc(q.ref)}" data-rating="${r}"><b>${r?'Your rating':'How did we do?'}</b><div class="rvs" role="group" aria-label="Rate this job">${[1,2,3,4,5].map(n=>`<button type="button" class="rvb ${n<=r?'on':''}" data-star="${n}" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}</div><div class="rvx" hidden><textarea maxlength="1000" rows="2" placeholder="Tell us more (optional)">${esc(q.review?q.review.comment:'')}</textarea><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px"><input type="checkbox" class="rvpub" ${q.review&&q.review.publicOk?'checked':''} style="width:auto;margin-top:3px"> <span>You may show my comment on the Xpress website, with my first name, last initial and town.</span></label><div style="margin-top:8px"><button type="button" class="xp-btn" data-rvsend>${r?'Update':'Send'}</button> <span class="meta rvm"></span></div></div></div>`;
}
let GOOGLE='';const UNVERIFIED='<div class="card" style="border-color:#ef4b00;background:#fff7f2"><b>Please confirm your email.</b> We sent you a link. Until you confirm, this account shows only requests you made after signing up, and your earlier requests stay hidden for your protection. <button class="xp-btn ghost" id="rvf" style="margin-left:8px;padding:8px 16px">Resend email</button></div>';
async function verifyFlow(t,pw){try{await api('/api/auth/verify',{method:'POST',body:{token:t,password:pw}});window.__flash='<div class="card" style="border-color:#1a7f37;background:#f1fbf4"><b style="color:#1a7f37">Email confirmed.</b> Your earlier requests and messages are now in your account.</div>'}catch(x){if(x.code==='password_needed')return verifyPwView(t,pw?x.message:'');window.__flash='<div class="card"><b>'+esc(x.message)+'</b></div>'}history.replaceState(null,'','/account/');load()}
function verifyPwView(t,err){app.innerHTML=`<div class="card auth"><h1 style="font-size:30px">Confirm your email</h1><p class="sub">Choose a password for your account to finish confirming. (If someone else created an account with your email, this takes it over safely.)</p><form class="ap" novalidate><label class="xp-field">New password (8+ characters)<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><p class="err" role="alert">${esc(err)}</p><button class="xp-btn" type="submit">Confirm and sign in</button></form></div>`;$('form',app).onsubmit=e=>{e.preventDefault();verifyFlow(t,e.target.password.value)}}
function quoteHTML(q){
  const idx=ORDER.indexOf(q.status);
  return `<div class="q"><header><div><b>${esc(q.service)}</b> <span class="meta">· ${esc(q.city)}${q.state?', '+esc(q.state):''}</span></div><span class="pill s-${q.status}">${esc(q.statusText)}</span></header>
  <p class="meta">Reference <b>${esc(q.ref)}</b> · Requested ${fmt(q.createdAt)}${q.urgent?' · <b style="color:#b53b00">Urgent</b>':''}</p>
  ${q.status!=='cancelled'?`<div class="steps" aria-hidden="true">${ORDER.map((s,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div>`:''}
  ${q.quoteAmount?`<p class="meta">Your quote</p><p class="big">${esc(q.quoteAmount)}</p>`:''}
  ${q.status==='scheduled'&&q.slotLabel?`<p class="meta">Appointment: <b>${esc(q.slotLabel)}</b> <span class="meta">(arrival window; your technician will call ahead)</span></p>`:q.slotLabel?`<p class="meta">Requested time: <b>${esc(q.slotLabel)}</b> · we’ll confirm it shortly</p>`:q.scheduledFor?`<p class="meta">Appointment: <b>${esc(q.scheduledFor)}</b></p>`:''}
  ${q.message?`<p class="meta">“${esc(q.message)}”</p>`:''}
  ${q.status==='completed'?reviewHTML(q):''}
  ${q.invoices.length?payHTML(q):''}
  <div class="xph-thumbs">${q.photos.map(p=>`<span class="xph-thumb"><a href="/api/me/quotes/${esc(q.ref)}/photos/${p.id}" target="_blank" rel="noopener"><img src="/api/me/quotes/${esc(q.ref)}/photos/${p.id}" alt="Your photo" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'photo',className:'meta'}))"></a>${['completed','cancelled'].includes(q.status)?'':`<button class="xph-x" data-delphoto="${esc(q.ref)}/${p.id}" aria-label="Remove photo">✕</button>`}</span>`).join('')}</div>
  <ul class="tl">${q.events.slice().reverse().map(e=>`<li><b>${esc(e.label)}</b> · ${fmtT(e.at)}</li>`).join('')}</ul>
  <div class="cta" style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="xp-btn ghost" data-open-chat>Message about this</button>${q.slotLabel&&!['completed','cancelled'].includes(q.status)?`<a class="xp-btn ghost" href="/api/me/quotes/${esc(q.ref)}/calendar.ics">Add to calendar</a>`:''}${['completed','cancelled'].includes(q.status)||q.photos.length>=8?'':`<button class="xp-btn ghost" data-addphoto="${esc(q.ref)}">📷 Add photos</button>`}${['completed','cancelled'].includes(q.status)?'':`<button class="xp-btn ghost" data-resched="${esc(q.ref)}" data-state="${esc(q.state)}">${q.slotLabel?'Reschedule':'Pick a time'}</button>`}${['completed','cancelled'].includes(q.status)?`<a class="xp-btn ghost" href="/contact-us/?service=">Book again</a>`:`<button class="xp-btn ghost" data-cancel="${esc(q.ref)}">Cancel request</button>`}</div></div>`;
}

async function load(){
  let banner=window.__flash||'';window.__flash='';const pid=qs.get('paid'),cid=qs.get('canceled');
  if(pid){try{const r=await api(`/api/me/invoices/${pid}/sync`);banner=r.status==='paid'?'<div class="card" style="border-color:#1a7f37;background:#f1fbf4"><b style="color:#1a7f37">Payment received. Thank you!</b> A receipt is on its way to your email.</div>':'<div class="card"><b>Your payment is still processing.</b> It can take a minute to show here. Refresh shortly, or message us if it doesn’t update.</div>'}catch{}history.replaceState(null,'','/account/')}
  else if(cid){banner='<div class="card"><b>Payment cancelled.</b> No charge was made. You can pay any time from the request below.</div>';history.replaceState(null,'','/account/')}
  let d;try{d=await api('/api/me')}catch(x){$('#out').hidden=true;return authView()}
  $('#out').hidden=false;GOOGLE=d.googleUrl||'';const c=d.customer,active=d.quotes.filter(q=>!['completed','cancelled'].includes(q.status)).length,done=d.quotes.filter(q=>q.status==='completed').length;
  app.innerHTML=`<h1>Hi, ${esc(c.name.split(' ')[0])}</h1><p class="sub">Your quotes, appointments and conversations with Xpress.</p>${banner}${c.verified===false?UNVERIFIED:''}
  <div class="grid"><div class="stat"><b>${active}</b>Active requests</div><div class="stat"><b>${done}</b>Completed jobs</div><div class="stat"><b>${d.quotes.length}</b>Total requests</div></div>
  <div class="card"><h2>Your requests</h2>${d.quotes.length?d.quotes.map(quoteHTML).join(''):'<p class="empty">No requests yet.</p>'}<a class="xp-btn" href="/contact-us/?state=${esc(c.state)}&city=${encodeURIComponent(c.city||'')}">Request a new quote</a></div>
  <div class="card"><h2>Messages</h2><p class="meta">Chat with our team for questions, changes, or if something isn’t right. Your conversation history is saved here.</p><button class="xp-btn" data-open-chat>Open chat</button></div>
  <div class="card"><h2>Your details</h2><form class="ap" id="prof"><div class="row2"><label class="xp-field">Name<input name="name" value="${esc(c.name)}" required></label><label class="xp-field">Phone<input name="phone" type="tel" value="${esc(c.phone)}"></label></div>
  <label class="xp-field">Service address<input name="address" value="${esc(c.address)}" autocomplete="street-address"></label><div class="row2"><label class="xp-field">City<input name="city" value="${esc(c.city)}"></label><label class="xp-field">State<select name="state"><option value="">—</option>${['PA','NJ','LA'].map(s=>`<option ${c.state===s?'selected':''}>${s}</option>`).join('')}</select></label></div>
  <label class="xp-field">About your door (brand, age, opener, gate code, access notes)<textarea name="doorNotes" rows="3">${esc(c.doorNotes)}</textarea></label>
  <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" name="emailReminders" ${c.emailReminders!==false?'checked':''} style="width:auto"> Email me a yearly check-up reminder and occasional review requests</label>
  <p class="ok" id="pmsg"></p><button class="xp-btn" type="submit" style="align-self:flex-start">Save details</button></form></div>
  <div class="card"><h2>Password</h2><form class="ap" id="pw" style="max-width:380px"><label class="xp-field">Current password<input name="password" type="password" autocomplete="current-password" required></label><label class="xp-field">New password<input name="newPassword" type="password" autocomplete="new-password" required minlength="8"></label><p class="err" id="pwm"></p><button class="xp-btn ghost" style="align-self:flex-start">Change password</button></form></div>`;
  $('#prof').onsubmit=async e=>{e.preventDefault();try{await api('/api/me',{method:'PATCH',body:{...Object.fromEntries(new FormData(e.target)),emailReminders:e.target.emailReminders.checked}});$('#pmsg').textContent='Saved ✓'}catch(x){$('#pmsg').textContent=x.message}};
  $('#pw').onsubmit=async e=>{e.preventDefault();try{await api('/api/me/password',{method:'POST',body:Object.fromEntries(new FormData(e.target))});$('#pwm').style.color='#1a7f37';$('#pwm').textContent='Password updated ✓';e.target.reset()}catch(x){$('#pwm').style.color='';$('#pwm').textContent=x.message}};
  const rvf=$('#rvf');if(rvf)rvf.onclick=async()=>{try{await api('/api/me/resend-verification',{method:'POST'});rvf.textContent='Sent ✓';rvf.disabled=true}catch(x){alert(x.message)}};
  app.querySelectorAll('[data-rv]').forEach(box=>{let sel=+box.dataset.rating||0;const paint=v=>box.querySelectorAll('.rvb').forEach(b=>b.classList.toggle('on',+b.dataset.star<=v));
    box.querySelectorAll('.rvb').forEach(b=>{b.onclick=()=>{sel=+b.dataset.star;paint(sel);box.querySelector('.rvx').hidden=false};b.onmouseenter=()=>paint(+b.dataset.star);b.onmouseleave=()=>paint(sel)});
    box.querySelector('[data-rvsend]').onclick=async()=>{const m=box.querySelector('.rvm');try{await api(`/api/me/quotes/${box.dataset.rv}/review`,{method:'POST',body:{rating:sel,comment:box.querySelector('textarea').value,publicOk:box.querySelector('.rvpub').checked}});box.dataset.rating=sel;box.querySelector('b').textContent='Thank you for your feedback!';box.querySelector('.rvx').innerHTML=GOOGLE?`<p class="meta" style="margin:6px 0">Would you share it on Google too?</p><a class="xp-btn" href="${esc(GOOGLE)}" target="_blank" rel="noopener">Review us on Google</a>`:'<p class="meta">Your feedback goes straight to our team.</p>'}catch(x){m.textContent=x.message}}});
  app.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{b.disabled=true;const t=b.textContent;b.textContent='Opening secure checkout…';try{const d=await api(`/api/me/invoices/${b.dataset.pay}/checkout`,{method:'POST'});location.href=d.url}catch(x){b.disabled=false;b.textContent=t;alert(x.message)}});
  app.querySelectorAll('[data-addphoto]').forEach(b=>b.onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{b.disabled=true;b.textContent='Uploading…';let bad=0;for(const f of [...i.files]){const c=await window.XpPhotos.compress(f);if(!c){bad++;continue}try{await window.XpPhotos.uploadOne(b.dataset.addphoto,c)}catch{bad++}}if(bad)alert(bad+' photo(s) could not be added (JPG/PNG/WebP/HEIC, up to 8 MB, 8 per request).');load()};i.click()});
  app.querySelectorAll('[data-delphoto]').forEach(b=>b.onclick=async e=>{e.preventDefault();if(confirm('Remove this photo?')){await api(`/api/me/quotes/${b.dataset.delphoto.split('/')[0]}/photos/${b.dataset.delphoto.split('/')[1]}`,{method:'DELETE'});load()}});
  app.querySelectorAll('[data-resched]').forEach(b=>b.onclick=()=>{const card=b.closest('.q');let box=card.querySelector('.rs');if(box){box.remove();return}box=document.createElement('div');box.className='rs';box.style.cssText='margin-top:14px;padding-top:14px;border-top:1px solid #e8e5e3';const host=document.createElement('div'),go=document.createElement('button'),msg=document.createElement('p');go.className='xp-btn';go.textContent='Request this time';go.disabled=true;go.style.marginTop='10px';msg.className='err';box.append(host,go,msg);card.append(box);let sel=null;window.XpBooking.mount(host,{getState:()=>b.dataset.state||c.state||'PA',optional:false,onChange:p=>{sel=p;go.disabled=!p}});go.onclick=async()=>{try{await api(`/api/me/quotes/${b.dataset.resched}/reschedule`,{method:'POST',body:{slotDate:sel.date,slotWindow:sel.window}});load()}catch(x){msg.textContent=x.message}}});
  app.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(confirm('Cancel this request?')){await api(`/api/me/quotes/${b.dataset.cancel}/cancel`,{method:'POST'});load()}});
}
$('#out').onclick=async e=>{e.preventDefault();await api('/api/auth/logout',{method:'POST'});localStorage.removeItem('xp_chat_token');location.reload()};
if(qs.get('reset'))resetView(qs.get('reset'));else if(qs.get('verify'))verifyFlow(qs.get('verify'));else load();
</script></body></html>
